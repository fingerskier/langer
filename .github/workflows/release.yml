# Build multi-OS langer binaries and attach them to a GitHub Release.
# Trigger: push a tag matching v* (e.g. v0.1.1).
# Maintainer docs: docs/RELEASING.md (pair tag with npm/@fingerskier/langer version).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            asset: langer_windows_amd64.exe
          - goos: linux
            goarch: amd64
            asset: langer_linux_amd64
          - goos: linux
            goarch: arm64
            asset: langer_linux_arm64
          - goos: darwin
            goarch: amd64
            asset: langer_darwin_amd64
          - goos: darwin
            goarch: arm64
            asset: langer_darwin_arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.asset }}" ./cmd/langer
          cd dist
          sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble release directory
        run: |
          mkdir -p release
          # download-artifact merge-multiple flattens into artifacts/
          find artifacts -type f \( -name 'langer_*' -o -name '*.sha256' \) -exec cp -t release {} +
          ls -la release
          test -f release/langer_linux_amd64
          test -f release/langer_windows_amd64.exe
          cd release
          cat *.sha256 | sort > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
